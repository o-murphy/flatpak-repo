name: Publish to Flatpak Repo
description: >
  Download .flatpak bundles from a GitHub Release and import them into
  the o-murphy/flatpak-repo OSTree repository hosted on GitHub Pages.

inputs:
  tag_name:
    description: Release tag to download .flatpak files from (e.g. v0.1.13)
    required: true
  repository:
    description: Source repository (owner/repo) to download .flatpak assets from
    required: false
    default: ${{ github.repository }}
  gpg_private_key:
    description: ASCII-armored GPG private key for signing the repo
    required: true
  gpg_passphrase:
    description: Passphrase for the GPG private key
    required: true
  flatpak_repo_token:
    description: Fine-grained PAT with Contents write access to o-murphy/flatpak-repo
    required: true

runs:
  using: composite
  steps:
    - name: Install flatpak + ostree
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y flatpak ostree

    - name: Download .flatpak assets from GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.flatpak_repo_token }}
      run: |
        mkdir -p dl
        gh release download "${{ inputs.tag_name }}" \
          --repo "${{ inputs.repository }}" \
          --pattern "*.flatpak" \
          --dir dl/
        echo "Downloaded:"
        ls -lh dl/

    - name: Import GPG key
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg_private_key }}
        GPG_PASSPHRASE: ${{ inputs.gpg_passphrase }}
      run: |
        echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format=long \
          | grep '^sec' | head -1 | awk '{print $2}' | cut -d/ -f2)
        echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV
        mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
        echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
        gpgconf --reload gpg-agent
        LIBEXEC=$(gpgconf --list-dirs libexecdir)
        gpg --with-keygrip --list-secret-keys "$GPG_KEY_ID" \
          | grep 'Keygrip' | awk '{print $3}' \
          | while read -r KEYGRIP; do
              echo "$GPG_PASSPHRASE" | "${LIBEXEC}/gpg-preset-passphrase" --preset "$KEYGRIP"
            done

    - name: Clone Flatpak repo
      shell: bash
      env:
        FLATPAK_REPO_TOKEN: ${{ inputs.flatpak_repo_token }}
      run: |
        # --separate-git-dir puts git internals outside the working tree so
        # OSTree's objects/ refs/ config don't clash with git's directory detection
        git clone \
          --separate-git-dir=/tmp/flatpak-repo-git \
          "https://x-access-token:${FLATPAK_REPO_TOKEN}@github.com/o-murphy/flatpak-repo.git" \
          /tmp/flatpak-repo

    - name: Initialize OSTree repo if empty
      shell: bash
      run: |
        if [ ! -f /tmp/flatpak-repo/config ]; then
          ostree init --mode=archive-z2 --repo=/tmp/flatpak-repo
        fi
        mkdir -p /tmp/flatpak-repo/refs/remotes

    - name: Import .flatpak bundles into OSTree repo
      shell: bash
      run: |
        # Save ref→commit snapshot to file (used by reparent step too)
        ostree refs --repo=/tmp/flatpak-repo 2>/dev/null \
          | grep '^app/' \
          | while IFS= read -r ref; do
              commit=$(ostree rev-parse --repo=/tmp/flatpak-repo "$ref" 2>/dev/null || true)
              printf '%s\t%s\n' "$ref" "$commit"
            done > /tmp/before_hashes.txt

        declare -A BEFORE
        while IFS=$'\t' read -r ref commit; do
          BEFORE["$ref"]="$commit"
        done < /tmp/before_hashes.txt

        for f in dl/*.flatpak; do
          [ -f "$f" ] || continue
          echo "Importing $f …"
          flatpak build-import-bundle /tmp/flatpak-repo "$f"
        done

        # Collect app IDs whose OSTree ref commit changed (new or updated)
        IMPORTED_APP_IDS=""
        while IFS= read -r ref; do
          [[ "$ref" == app/* ]] || continue
          IFS='/' read -r _ app_id _ _ <<< "$ref"
          after=$(ostree rev-parse --repo=/tmp/flatpak-repo "$ref" 2>/dev/null || true)
          if [[ "$after" != "${BEFORE[$ref]:-}" ]]; then
            IMPORTED_APP_IDS="$IMPORTED_APP_IDS $app_id"
          fi
        done < <(ostree refs --repo=/tmp/flatpak-repo 2>/dev/null || true)

        IMPORTED_APP_IDS=$(echo "$IMPORTED_APP_IDS" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)
        echo "IMPORTED_APP_IDS=$IMPORTED_APP_IDS" >> "$GITHUB_ENV"
        echo "Detected imported app IDs: $IMPORTED_APP_IDS"

    - name: Reparent imported commits
      shell: bash
      run: |
        # Restore before-hashes saved by import step
        declare -A BEFORE_COMMITS
        if [ -f /tmp/before_hashes.txt ]; then
          while IFS=$'\t' read -r ref commit; do
            [ -n "$commit" ] && BEFORE_COMMITS["$ref"]="$commit"
          done < /tmp/before_hashes.txt
        fi

        while IFS= read -r ref; do
          [[ "$ref" == app/* ]] || continue

          old_commit="${BEFORE_COMMITS[$ref]:-}"
          [ -n "$old_commit" ] || continue  # first-ever import, no parent to set

          new_commit=$(ostree rev-parse --repo=/tmp/flatpak-repo "$ref" 2>/dev/null || true)
          [ -n "$new_commit" ] || continue
          [[ "$new_commit" == "$old_commit" ]] && continue  # ref unchanged

          subject=$(ostree show --repo=/tmp/flatpak-repo "$new_commit" 2>/dev/null \
            | grep -m1 "^Subject:" | sed 's/^Subject: //' \
            || echo "Export")

          reparented=$(ostree commit \
            --repo=/tmp/flatpak-repo \
            --branch="$ref" \
            --tree=ref="$ref" \
            --parent="$old_commit" \
            --subject="$subject")

          echo "Reparented $ref"
          echo "  parent:     $old_commit"
          echo "  old commit: $new_commit"
          echo "  new commit: $reparented"
        done < <(ostree refs --repo=/tmp/flatpak-repo 2>/dev/null || true)

    - name: Sign and update repo
      shell: bash
      run: |
        flatpak build-sign /tmp/flatpak-repo --gpg-sign="$GPG_KEY_ID"
        flatpak build-update-repo /tmp/flatpak-repo \
          --gpg-sign="$GPG_KEY_ID" \
          --generate-static-deltas
        GPG_PUBLIC_KEY=$(gpg --export "$GPG_KEY_ID" | base64 -w 0)
        {
          echo '[Flatpak Repo]'
          echo 'Title=o-murphy Flatpak Repository'
          echo 'Url=https://o-murphy.github.io/flatpak-repo/'
          echo 'Homepage=https://github.com/o-murphy/flatpak-repo'
          echo 'Description=Self-hosted Flatpak repository for apps by o-murphy'
          echo "GPGKey=${GPG_PUBLIC_KEY}"
        } > /tmp/flatpak-repo/o_murphy.flatpakrepo

    - name: Generate apps.json
      shell: bash
      run: |
        cat > /tmp/gen_apps.py << 'PYEOF'
        import subprocess, json, re, sys, os
        import xml.etree.ElementTree as ET

        REPO         = '/tmp/flatpak-repo'
        TAG          = sys.argv[1]
        SOURCE_REPO  = sys.argv[2]
        # Space-separated list of app IDs that were actually imported this run
        IMPORTED_IDS = set(sys.argv[3].split()) if len(sys.argv) > 3 and sys.argv[3] else set()

        # Load existing apps.json to preserve metadata for unrelated apps
        existing = {}
        apps_json_path = f'{REPO}/apps.json'
        if os.path.exists(apps_json_path):
            with open(apps_json_path) as f:
                data = json.load(f)
                if isinstance(data, list):
                    existing = {a['id']: a for a in data if 'id' in a}
                elif isinstance(data, dict):
                    existing = data

        refs = subprocess.check_output(['ostree', 'refs', '--repo', REPO]).decode().splitlines()

        def get_appstream(repo, ref, app_id):
            paths = [
                f'/export/share/metainfo/{app_id}.metainfo.xml',
                f'/export/share/appdata/{app_id}.appdata.xml',
                f'/files/share/metainfo/{app_id}.metainfo.xml',
                f'/files/share/appdata/{app_id}.appdata.xml',
            ]
            for path in paths:
                try:
                    xml = subprocess.check_output(
                        ['ostree', 'cat', '--repo', repo, ref, path],
                        stderr=subprocess.DEVNULL
                    ).decode()
                    root = ET.fromstring(xml)
                    name = next((el.text for el in root.findall('name')
                                 if el.get('{http://www.w3.org/XML/1998/namespace}lang') is None), None)
                    desc_el = root.find('description')
                    desc = None
                    if desc_el is not None:
                        p = desc_el.find('p')
                        if p is not None and p.text:
                            desc = p.text.strip()
                    return name, desc
                except Exception:
                    continue
            return None, None

        def get_commit(repo, ref):
            try:
                return subprocess.check_output(
                    ['ostree', 'rev-parse', '--repo', repo, ref],
                    stderr=subprocess.DEVNULL
                ).decode().strip()
            except Exception:
                return None

        apps = {}
        for ref in refs:
            ref = ref.strip()
            if not ref.startswith('app/'):
                continue
            parts = ref.split('/')
            if len(parts) != 4:
                continue
            _, app_id, arch, branch = parts

            try:
                meta = subprocess.check_output(
                    ['ostree', 'cat', '--repo', REPO, ref, '/metadata']
                ).decode()
            except subprocess.CalledProcessError:
                continue

            m = re.search(r'^runtime=(.+)$', meta, re.MULTILINE)
            runtime = None
            if m:
                rparts = m.group(1).split('/')
                runtime = f'{rparts[0]}/{rparts[-1]}'

            ex = existing.get(app_id, {})
            is_imported = app_id in IMPORTED_IDS
            key = app_id

            if key not in apps:
                name, description = get_appstream(REPO, ref, app_id)

                if is_imported:
                    version = TAG
                    source_repo = SOURCE_REPO
                    old_versions = ex.get('versions', [])
                    new_entry = {'version': TAG, 'commits': {}}
                    if not old_versions or old_versions[0].get('version') != TAG:
                        versions = ([new_entry] + old_versions)[:10]
                    else:
                        # Same version re-published: reset commits to rebuild
                        versions = [{'version': TAG, 'commits': {}}] + old_versions[1:]
                else:
                    version = ex.get('version', 'unknown')
                    source_repo = ex.get('source_repo')
                    versions = ex.get('versions', [])

                apps[key] = {
                    'id': app_id,
                    'name': name or ex.get('name'),
                    'description': description or ex.get('description'),
                    'branch': branch,
                    'version': version,
                    'commits': {},
                    'source_repo': source_repo,
                    'arches': [],
                    'runtime': runtime,
                    'runtime_remote': ex.get('runtime_remote', 'flathub'),
                    'versions': versions,
                }

            if arch not in apps[key]['arches']:
                apps[key]['arches'].append(arch)

            # Store commit hash keyed by arch
            if is_imported:
                commit = get_commit(REPO, ref)
                apps[key]['commits'][arch] = commit
                if apps[key]['versions']:
                    apps[key]['versions'][0]['commits'][arch] = commit
            else:
                ex_commits = ex.get('commits', {})
                apps[key]['commits'][arch] = ex_commits.get(arch)

        with open(apps_json_path, 'w') as f:
            json.dump(apps, f, indent=2)
        print(json.dumps(apps, indent=2))
        PYEOF
        python3 /tmp/gen_apps.py "${{ inputs.tag_name }}" "${{ inputs.repository }}" "$IMPORTED_APP_IDS"

    - name: Push to flatpak-repo
      shell: bash
      env:
        FLATPAK_REPO_TOKEN: ${{ inputs.flatpak_repo_token }}
      run: |
        cd /tmp/flatpak-repo
        git config user.name "o-murphy"
        git config user.email "thehelixpg@gmail.com"
        git add -A
        git diff --cached --quiet && echo "No changes" && exit 0
        git commit -m "Update ${{ inputs.repository }} to ${{ inputs.tag_name }}"
        git push "https://x-access-token:${FLATPAK_REPO_TOKEN}@github.com/o-murphy/flatpak-repo.git"
